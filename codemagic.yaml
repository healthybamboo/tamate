# Codemagic の設定。
#
# リリース用の PR（release/<version> → release/ios）が作られるとビルドが始まり、
# TestFlight まで上がる。PR を作るのは .github/workflows/deploy.yml の役目。
# 使う前に Codemagic 側で用意するものは docs/release.md を参照。
workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    # release/ios 宛の PR ができたときに動かす。手動実行もできる。
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: release/ios
          include: true
          source: false
      cancel_previous_builds: true

    environment:
      flutter: 3.27.1
      xcode: latest
      cocoapods: default

      # App Store Connect の API キー。Codemagic の Integrations で作った名前を書く。
      integrations:
        app_store_connect: tamate

      # 署名は Codemagic に取りに行かせる。証明書もプロファイルも手元に置かない。
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.bamgrove.tamate

      vars:
        BUNDLE_ID: net.bamgrove.tamate

    scripts:
      - name: 依存を入れる
        script: flutter pub get

      - name: 静的解析
        script: flutter analyze

      - name: テスト
        script: flutter test

      - name: ビルド番号を決める
        script: |
          # TestFlight にある最新のビルド番号の次を使う。番号が重なると弾かれるため。
          LATEST=$(app-store-connect get-latest-testflight-build-number \
            --bundle-id "$BUNDLE_ID" 2>/dev/null || echo 0)
          echo "BUILD_NUMBER=$((LATEST + 1))" >> "$CM_ENV"

      - name: Pods を入れる
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: ipa を作る
        script: |
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # TestFlight まで。審査には出さない。
        submit_to_testflight: true
        submit_to_app_store: false

      email:
        recipients:
          - takeru-sakuma@bamgrove.net
        notify:
          success: true
          failure: true

  # Android。Codemagic に Google Play のサービスアカウントを登録すると動く。
  # 登録するまではリリースの入力で Android を off にしておく。
  android-internal:
    name: Android internal testing
    instance_type: mac_mini_m2
    max_build_duration: 60

    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: release/android
          include: true
          source: false
      cancel_previous_builds: true

    environment:
      flutter: 3.27.1
      groups:
        # keystore（CM_KEYSTORE ほか）と GCLOUD_SERVICE_ACCOUNT_CREDENTIALS を入れる。
        - google_play
      android_signing:
        - tamate_upload

    scripts:
      - name: 依存を入れる
        script: flutter pub get

      - name: 静的解析
        script: flutter analyze

      - name: テスト
        script: flutter test

      - name: ビルド番号を決める
        script: |
          LATEST=$(google-play get-latest-build-number \
            --package-name net.bamgrove.tamate --tracks internal 2>/dev/null || echo 0)
          echo "BUILD_NUMBER=$((LATEST + 1))" >> "$CM_ENV"

      - name: aab を作る
        script: flutter build appbundle --release --build-number="$BUILD_NUMBER"

    artifacts:
      - build/app/outputs/bundle/**/*.aab

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

      email:
        recipients:
          - takeru-sakuma@bamgrove.net
        notify:
          success: true
          failure: true
