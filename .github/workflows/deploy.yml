name: Release

permissions: write-all

on:
  workflow_dispatch:
    inputs:
      release_type:
        type: choice
        description: リリースの種類（バージョンを直接入れる場合は無視される）
        default: patch
        options:
          - major # 例: 1.0.0 -> 2.0.0
          - minor # 例: 1.0.0 -> 1.1.0
          - patch # 例: 1.0.0 -> 1.0.1
      release_version:
        description: "「1.4.1」の形式。入れた場合はカウントアップしない"
        type: string
        required: false
      ios_release:
        type: boolean
        description: iOS をリリースしますか？
        default: true
      android_release:
        type: boolean
        description: Android をリリースしますか？（Codemagic 側の設定が要る）
        default: false

run-name: Release by @${{ github.actor }}

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_ACTOR: ${{ github.actor }}
  # リリース用 GitHub App の ID。入っていればそのトークンで push と PR 作成をする。
  # 空なら GITHUB_TOKEN で動く。詳細は docs/release.md の「push が弾かれるとき」。
  RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}

jobs:
  # 静的解析とテストが通ることを確かめる。
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  # バージョンを決めて、タグとリリースブランチを作る。
  prepare_release:
    needs: [ci]
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.prepare_output.outputs.release_version }}
    steps:
      # main はルールセットで直接の push を止めてある。素の GITHUB_TOKEN では
      # 弾かれる（GH013）ので、bypass に入れた GitHub App のトークンで押し込む。
      # App を登録していなければこの手順は飛ばし、GITHUB_TOKEN のまま進む。
      - name: Generate a token
        id: app_token
        if: env.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          # 以降の push はこのトークンの持ち主として行われる。
          token: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}

      # 種類か、直接指定された値からバージョンを決める。
      - name: Get release version
        run: |
          if [ -z "${{ github.event.inputs.release_version }}" ]; then
            echo "version=$(./.github/shell/get_countup_version -t ${{ github.event.inputs.release_type }})" >> $GITHUB_ENV
          else
            echo "version=${{ github.event.inputs.release_version }}" >> $GITHUB_ENV
          fi

      # pubspec.yaml のバージョンとビルド番号を更新する。
      - name: Set release version
        run: ./.github/shell/set_conf_version -f ./pubspec.yaml -v ${{ env.version }}

      - name: Push changes
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          if (git diff --shortstat | grep '[0-9]'); then
            git add .
            git commit -m "chore: バージョンを ${VERSION} にする"
            git push origin HEAD:${GITHUB_REF}
          fi
          git tag -a ${VERSION} -m "Release ${VERSION}"
          git push origin ${VERSION}
        env:
          VERSION: ${{ env.version }}

      # リリースノートはドラフトで作る。中身を見てから公開する。
      - name: Create release note
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.version }}
          draft: true
          generate_release_notes: true

      # main の動きから切り離すため、リリース専用のブランチを切る。
      # これがあると、リリース中でも main にマージしてよくなる。
      - name: Create release branch
        run: |
          git checkout -b release/${{ env.version }}
          git push origin release/${{ env.version }}

      - name: Set output
        id: prepare_output
        run: echo "release_version=${{ env.version }}" >> $GITHUB_OUTPUT

  # 以下、プラットフォームごとにリリース用の PR を作る。
  # PR ができると Codemagic がビルドを始める。確認できたらマージする。
  release_ios:
    needs: [prepare_release]
    name: Release iOS
    if: ${{ github.event.inputs.ios_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # PR は App の名前で作る。GITHUB_TOKEN で PR を作れるかは設定次第なので、
      # App を登録してあるならそちらを使う。無ければ GITHUB_TOKEN のまま進む。
      - name: Generate a token
        id: app_token
        if: env.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4

      # release_version, assignee, reviewer, platform の順で渡す。
      - name: Create Release Pull Request
        env:
          # GITHUB_TOKEN では PR を作れない設定のこともあるので、App があればそちらで。
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          ./.github/shell/release_pr ${{ needs.prepare_release.outputs.release_version }} \
                                     ${{ github.actor }} \
                                     ${{ github.actor }} \
                                     ios

  release_android:
    needs: [prepare_release]
    name: Release Android
    if: ${{ github.event.inputs.android_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # PR は App の名前で作る。GITHUB_TOKEN で PR を作れるかは設定次第なので、
      # App を登録してあるならそちらを使う。無ければ GITHUB_TOKEN のまま進む。
      - name: Generate a token
        id: app_token
        if: env.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Release Pull Request
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          ./.github/shell/release_pr ${{ needs.prepare_release.outputs.release_version }} \
                                     ${{ github.actor }} \
                                     ${{ github.actor }} \
                                     android
