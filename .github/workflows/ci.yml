name: CI

on:
  # リリースの流れからも呼ぶ。
  workflow_call:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # 生成物は追跡していないため、Git 管理下の .dart のみを対象にする。
      - name: Verify formatting
        run: git ls-files '*.dart' | xargs dart format --output=none --set-exit-if-changed

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
